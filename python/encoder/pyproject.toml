[project]
name = "encoder"
version = "0.1.0"
description = "Contrastive glyph encoder for the treasury engine: 256-bit codes invariant to the face, trained on cross-face pairs; exported to ONNX and to a Go-embedded weight file"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=2.0",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[tool.uv]
package = false
