[project]
name = "digits"
version = "0.1.0"
description = "Digit-class glyph classifier for the treasury engine: data from cmd/digits, model exported to ONNX and to a Go-embedded weight file"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=2.0",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[tool.uv]
package = false
