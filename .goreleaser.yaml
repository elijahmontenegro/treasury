# The release: one container, stamped with the commit it was built from,
# and a changelog assembled from the commits themselves.
#
# What this file does NOT do is build the binary, and the reason is worth
# stating rather than leaving as a puzzle. The reader calls ONNX Runtime
# through cgo, so the binary must be linked against that library on the
# platform it will run on; GoReleaser's usual shape — cross-compile on the
# host, then wrap the result in a thin image — cannot produce it from a
# Windows or macOS workstation. So the Dockerfile builds it inside a Linux
# image, as it has since step 30's second item, and GoReleaser drives that
# build, passes the identity into it, tags it, and writes the changelog.
version: 2

project_name: label-verifier

builds:
  - id: in-the-image
    skip: true

# The image is built by the Dockerfile, which fetches its own pinned ONNX
# Runtime and compiles with cgo. The two build arguments are the build
# identity: internal/buildid prefers what the Go tool chain read from .git
# and falls back to these, which is what happens here, because
# .dockerignore keeps a 116 MB history out of a context that needs two
# strings from it.
dockers_v2:
  - id: service
    dockerfile: Dockerfile
    platforms: [linux/amd64]
    # GHCR, under this repository, so the artefact a reader can pull is
    # beside the code they read. The deployed service pulls from Artifact
    # Registry instead, and why is in the README: Cloud Run will not pull
    # from GHCR, and pushing there from CI would need a Google credential
    # in this workflow, which is the one thing this arrangement avoids.
    images:
      - "ghcr.io/elijahmontenegro/treasury"
    tags:
      - "{{ .Version }}"
      - "latest"
    build_args:
      COMMIT: "{{ .FullCommit }}"
      COMMIT_TIME: "{{ .CommitDate }}"
    # GoReleaser builds in a temporary directory holding the Dockerfile and
    # whatever is named here, not in the repository root, so the context has
    # to be listed. That is a virtue rather than a nuisance: this is the
    # whole of what the image is built from, checked against the Dockerfile
    # and against every go:embed, and it is the same set .dockerignore
    # arrives at by subtraction.
    extra_files:
      - go.mod
      - go.sum
      - api
      - cmd
      - internal
      - ttb
      - verify
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: "Apache-2.0"

# Grouped by what a reader of this project would look for: what reads the
# label, what decides, what serves it, and what was measured. The history
# is one gated step per commit, so the subjects already carry the grouping
# and none has to be imposed on them after the fact.
#
# The patterns were checked against the subjects rather than guessed at: a
# first set left 38 of 87 commits ungrouped, among them the digit
# classifier and the numeric read, and they were widened until what falls
# through is what genuinely belongs nowhere. Groups are tried in order and
# the first match wins, so the narrower ones come first.
changelog:
  use: git
  sort: asc
  groups:
    - title: The service around it
      regexp: '(?i)(item [1-6]|30[b-g]|service|batch|openapi|readme|container|distroless|hardening|goreleaser|the page|deploy)'
      order: 0
    - title: The reader
      regexp: '(?i)(read|detect|recognis|ocr|glyph|preprocess|segment|separat|encoder|classifier|orientation|region|dot merging|merged pair|crop)'
      order: 1
    - title: The decision
      regexp: '(?i)(rule|radius|distance|verdict|refus|precision|claim|alphabet|warning|numeric|number|delimit|chain|spell|decode|enumerat|form gap|harvest|cache key|variant|emphasis|reference)'
      order: 2
    - title: Measurement, apparatus and speed
      regexp: '(?i)(measure|latency|p95|parallel|bounded|determinism|guard|diagnostic|corpus|table|profile|gate|bench|apparatus|transfer|score|lost|judged|partition|eval|record|ceiling|tuning|the loop|font|one at a time)'
      order: 3
    - title: Everything else
      order: 999
  filters:
    exclude:
      - '^Merge '

# The GitHub Release carries the changelog and nothing else: there are no
# binaries to attach, because the binary is inside the image and cannot be
# built anywhere but in it.
release:
  draft: false
  prerelease: auto
  mode: replace
  name_template: "{{ .Tag }}"
