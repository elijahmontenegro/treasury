name: release

# A tag produces the artefact. Until now the image existed because two
# commands were typed on a workstation, and nothing in the repository
# recorded which ones; a tag now leaves an image and a release that anyone
# can check against the commit they name.
#
# It does not deploy. Deploys stay manual, and this workflow holds no
# credential that could reach the Cloud Run project even if it tried.

on:
  push:
    tags:
      - 'v*'

# The only token here is GitHub's own, scoped to what a release needs and
# nothing else: write the release, write the package. It cannot reach any
# other repository, it expires with the job, and there is no secret to
# rotate or to leak.
permissions:
  contents: write
  packages: write

jobs:
  release:
    name: image and release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pinned to commit SHAs rather than tags, all of them. A tag is a
      # movable pointer, and this job holds a token that can publish under
      # this repository's name; an action that changed under a tag it had
      # already been reviewed at would be publishing with it.
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the changelog is the commits, and the identity is one of them

      - name: go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache: true

      # The SBOM attestation the release attaches needs a builder the
      # default Docker driver does not provide; found by the attestation
      # failing rather than by reading about it.
      - name: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: log in to ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # GoReleaser drives the Dockerfile, which builds the binary inside a
      # Linux image because it links against ONNX Runtime through cgo, and
      # passes the commit and its date in so the image says which source it
      # came from. Then it writes the changelog and cuts the release.
      - name: goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: '~> v2'
          args: release --clean --timeout 40m
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Not a formality: a release that published nothing should not
      # report success. This pulls what was pushed, by the tag the release
      # was cut from, and asks the binary inside it which commit it is.
      - name: the image exists and says which commit it is
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${v}"
          echo "pulling $image"
          docker pull "$image"
          docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' > got
          echo "image says: $(cat got)"
          echo "tag is at:  ${GITHUB_SHA}"
          if [ "$(cat got)" != "${GITHUB_SHA}" ]; then
            echo "the image does not carry the commit the tag names"; exit 1
          fi
